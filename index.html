<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuffolkHam</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .accent {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hello, <span class="accent">SuffolkHam</span></h1>
    <p>Amateur radio for Suffolk and beyond.</p>
  </div>

</body>
</html>
